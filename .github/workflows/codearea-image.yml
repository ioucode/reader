# ioucode fork: test, then publish the arm64 image the codearea cluster runs.
#
#   push to `codearea`  -> ghcr.io/ioucode/reader:codearea-<short sha>
#
# Lean on purpose: upstream ci.yml/release.yml (UI review, Android APK, Docker Hub)
# are disabled in this fork to save Actions minutes. Only typecheck + unit tests.
name: codearea-image

on:
  push:
    branches: [codearea]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: codearea-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/ioucode/reader

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: server · typecheck + test
        working-directory: server
        run: npm ci && npm run typecheck && npm test
      - name: web · typecheck + test
        run: |
          npm ci --prefix web
          npm run typecheck --prefix web
          npm test --prefix web
      - name: Tag
        run: echo "TAG=codearea-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha,scope=codearea-arm64
          cache-to: type=gha,mode=max,scope=codearea-arm64
      - name: Digest
        run: echo "### ${IMAGE}:${TAG}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
